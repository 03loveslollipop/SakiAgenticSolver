name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017/test
          AZURE_SUBSCRIPTION_ID: test-subscription
          AZURE_CLIENT_ID: test-client
          AZURE_CLIENT_SECRET: test-secret
          AZURE_TENANT_ID: test-tenant
          AZURE_RESOURCE_GROUP: test-rg
        run: |
          pytest -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/pytest-report.xml
          retention-days: 7

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t ctf-backend:${{ github.sha }} .
          docker tag ctf-backend:${{ github.sha }} ctf-backend:latest
      
      - name: Test Docker image
        run: |
          docker run -d --name test-backend \
            -e MONGODB_URL=mongodb://localhost:27017 \
            -e AZURE_SUBSCRIPTION_ID=test \
            -e AZURE_CLIENT_ID=test \
            -e AZURE_CLIENT_SECRET=test \
            -e AZURE_TENANT_ID=test \
            -p 8000:8000 \
            ctf-backend:${{ github.sha }}
          
          # Wait for container to start
          sleep 10
          
          # Check health endpoint
          curl -f http://localhost:8000/health || exit 1
          
          # Stop container
          docker stop test-backend
          docker rm test-backend

  deploy:
    name: Deploy to Northflank
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Northflank deployment
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "projectId": "${{ secrets.NORTHFLANK_PROJECT_ID }}",
              "serviceId": "${{ secrets.NORTHFLANK_BACKEND_SERVICE_ID }}",
              "type": "build"
            }' \
            https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/${{ secrets.NORTHFLANK_BACKEND_SERVICE_ID }}/build
      
      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 60
      
      - name: Verify deployment
        run: |
          # Get service URL from Northflank (you'll need to set this as a secret or fetch it)
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          
          # Check health endpoint
          for i in {1..10}; do
            if curl -f "$BACKEND_URL/health"; then
              echo "Deployment successful!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          
          echo "Deployment verification failed"
          exit 1
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Backend deployed successfully to Northflank"
          else
            echo "❌ Backend deployment failed"
          fi
