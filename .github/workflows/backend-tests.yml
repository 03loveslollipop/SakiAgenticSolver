name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate backend syntax
        working-directory: backend
        run: |
          python -m py_compile main.py
          python -m py_compile core_service/main.py
          python -m py_compile control_service/main.py

      - name: Run tests
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017/test
          AZURE_SUBSCRIPTION_ID: test-subscription
          AZURE_CLIENT_ID: test-client
          AZURE_CLIENT_SECRET: test-secret
          AZURE_TENANT_ID: test-tenant
          AZURE_RESOURCE_GROUP: test-rg
        run: |
          pytest -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/pytest-report.xml
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Backend tests passed"
          else
            echo "Backend tests failed"
            echo "Check the logs above for details"
          fi

  build-services:
    name: Build Core/Control Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build core service image
        run: docker build -f backend/Dockerfile.core backend -t ctf-platform-core:test

      - name: Build control service image
        run: docker build -f backend/Dockerfile.control backend -t ctf-platform-control:test
